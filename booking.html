<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">Snazzy Paws Grooming</div>
      <button class="hamburger-menu" aria-label="Toggle navigation">( ≡ )</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="booking.html">Booking</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="booking-container">
      <h1>Request a Booking</h1>
      <form action="#" method="post" class="booking-form">
        <!-- Left Column / Section 1 -->
        <div class="form-group owner-details">
          <label for="owner-name">Owner Name</label>
          <input type="text" id="owner-name" name="owner_name" required>

          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required>

          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>

        <!-- Right Column / Section 2 -->
        <div class="form-group pet-details">
          <label for="pet-name">Pet Name</label>
          <input type="text" id="pet-name" name="pet_name" required>

          <label for="breed">Breed</label>
          <input type="text" id="breed" name="breed" required>

          <label for="slot">Preferred Date/Time Slot</label>
          <input type="datetime-local" id="slot" name="slot" required>

          <label for="package">Package Selection</label>
          <select id="package" name="package">
            <option value="bathing">Bathing</option>
            <option value="full-clip">Full Clip</option>
            <option value="nail-trimming">Nail Trimming</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">Submit Booking Request</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Hours: Mon-Sat, 9 am - 5 pm</p>
  </footer>
</body>
</html>
