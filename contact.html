<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>        
        <nav>
            <div class="logo">Snazzy Paws Grooming</div>
            <!-- Use a checkbox and label for pure CSS toggling -->
            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="hamburger-menu" aria-label="Toggle navigation">☰</label>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="booking.html">Booking</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-container">
            <!-- Operational Details -->
            <div class="contact-details">
                <h2>Contact Details</h2>
                <p><strong>Address:</strong> 123 Main Street, Hamilton</p>
                <p><strong>Phone:</strong> <a href="tel:071234567">07 123 4567</a></p>
                <p><strong>Email:</strong> <a href="mailto:info@snazzypaws.co.nz">info@snazzypaws.co.nz</a></p>
                <p><strong>Hours of Operation:</strong> Mon-Sat, 9 am - 5 pm</p>

                <!-- Contact Form -->
                <form action="#" method="post" class="contact-form">
                    <label for="contact-name">Name</label>
                    <input type="text" id="contact-name" name="name" required>

                    <label for="contact-email">Email</label>
                    <input type="email" id="contact-email" name="email" required>

                    <label for="contact-phone">Phone Number</label>
                    <input type="tel" id="contact-phone" name="phone">

                    <label for="comment">Comment</label>
                    <textarea id="comment" name="comment" rows="4"></textarea>

                    <button type="submit">Send Message</button>
                </form>
            </div>

            <!-- Google Map Placeholder -->
            <div class="map-container">
                <iframe title="Hamilton Salon Location"
                        src="https://maps.google.com/maps?q=Hamilton&t=&z=13&ie=UTF8&iwloc=&output=embed"
                        width="100%"
                        height="350"
                        style="border:0;"
                        allowfullscreen=""
                        loading="lazy">
                </iframe>
            </div>
        </section>
    </main>

    <footer>
        <p>Hours: Mon-Sat, 9 am - 5 pm</p>
    </footer>
</body>
</html>
